# Rerun a run from its cloud-native output: rebuild the run folder (cng-to-ngen), run NextGen again and
# convert. The cng input must come from ngiab-to-cng 0.3.0 or later; an older one is refused by cng-to-ngen.
- kind: pipeline
  id: ngiab-rerun
  version: 0.1.0
  title: Rerun NextGen from a cloud-native output, convert to cloud-native files
  inputs:
    - {name: cng, type: directory, data: ngen-cng,
       description: "the cng output of an earlier ngiab-simulation, ngiab-calibration or ngiab-rerun job (0.2.0+)"}
    - {name: configuration_name, type: string, default: ngiab_rerun}
  steps:
    - name: rebuild
      tool: {id: cng-to-ngen, version: 0.1.0}
      inputs:
        cng: {input: cng}
    - name: run
      tool: {id: ngiab-run, version: 2.1.0}
      inputs:
        ngen_run: {step: rebuild, output: ngen_run}
    - name: to-cng
      tool: {id: ngiab-to-cng, version: 0.3.0}
      inputs:
        ngen_run: {step: run, output: ngen_run}
        configuration_name: {input: configuration_name}
  outputs:
    run: {step: run, output: ngen_run}
    cng: {step: to-cng, output: cng}

# ---- TEEHR evaluation (hydrowf-tools docs/design/teehr-evaluation.md)

# What an evaluation reads; any model's tool can write it (ngiab-to-cng --format teehr-timeseries for NextGen):
# manifest.json, timeseries/secondary.parquet (TEEHR's schema and names), crosswalk.parquet (to usgs-<site>)
- kind: data
  id: teehr-timeseries
  version: 1.0.0
  title: Simulated time series for evaluation, with a crosswalk to USGS gages (TEEHR schema)
  data_kind: output
  storage: {driver: stac, format: other}

# teehr-evaluate's output: metrics.parquet, locations.parquet (the gages, GeoParquet) and manifest.json
- kind: data
  id: teehr-metrics
  version: 1.0.0
  title: TEEHR metrics per gage and configuration, and the gages evaluated
  data_kind: output
  storage: {driver: stac, format: other}

# 0.4.0: --format writes ngen-cng (as 0.3.0) or teehr-timeseries (hydrowf-tools nextgen/ngiab-to-cng)
- kind: tool
  id: ngiab-to-cng
  version: 0.4.0
  title: NGIAB run to cloud-native files, or to TEEHR time series for evaluation
  image: ghcr.io/aquaveo/ngiab-to-cng@sha256:953ea53082e82c73431b1e33e52497fde8a2bbb6d16edaa7ab67932c10122b8f   # 0.4.0
  command: [python, /app/ngiab_to_cng.py]
  args:
    - "{ngen_run}"
    - --output
    - "{workdir}/ngen-run_cng"
    - --run-id
    - "{run}"
    - --configuration-name
    - "{configuration_name}"
    - --format
    - "{cng_format}"
  inputs:
    - {name: ngen_run, type: directory, data: ngen-run, path: ngen-run}
    - {name: configuration_name, type: string, default: ngiab, pattern: '[A-Za-z0-9][A-Za-z0-9_-]*',
       description: TEEHR configuration name}
  outputs:
