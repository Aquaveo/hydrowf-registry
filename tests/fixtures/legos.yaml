       description: "the simulation's name in the metrics; not usgs_observations or nwm30_retrospective (TEEHR's own)"}
    - {name: metrics, type: string, default: "kge,nse,relative_bias,rmsdr",
       description: "distinct names, comma-separated, from kge, kge_mod1, kge_mod2, nse, nnse, relative_bias, rmsdr, rmse, mae, pearson, r2, annual_peak_relative_bias"}
    - {name: baseline, type: enum, symbols: [none, nwm30_retrospective], default: none,
