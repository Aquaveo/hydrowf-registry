  cpu: 1
  ram_mb: 2048

# From hydrowf-tools evaluation/teehr-evaluate. `command` is the image's whole ENTRYPOINT: entrypoint.sh gives
# a uid the image doesn't name a user name, which Spark's Hadoop needs. Needs the internet (USGS, NOAA).
- kind: tool
  id: teehr-evaluate
  version: 0.1.0
  title: Evaluate simulated time series against USGS observations (TEEHR)
  image: ghcr.io/aquaveo/teehr-evaluate@sha256:f220a40eda744089893a4eb35f7b6e5cea8747d8f175f3dd52d7c2fb9dad5915   # 0.1.0
  command: [/app/entrypoint.sh, python, /app/teehr_evaluate.py]
  args:
    - "{timeseries}"
    - --output
    - "{workdir}/evaluation"
    - --run-id
    - "{run}"
    - --metrics
    - "{metrics}"
    - --baseline
    - "{baseline}"
  inputs:
    - {name: timeseries, type: dataset, data: teehr-timeseries}          # read in place with the step's keys
    - {name: metrics, type: string, default: "kge,nse,relative_bias,rmsdr",
       pattern: '(kge|kge_mod1|kge_mod2|nse|nnse|relative_bias|rmsdr|rmse|mae|pearson|r2|annual_peak_relative_bias)(,(kge|kge_mod1|kge_mod2|nse|nnse|relative_bias|rmsdr|rmse|mae|pearson|r2|annual_peak_relative_bias))*',
       description: "distinct names, comma-separated, from kge, kge_mod1, kge_mod2, nse, nnse, relative_bias, rmsdr, rmse, mae, pearson, r2, annual_peak_relative_bias"}
    - {name: baseline, type: enum, symbols: [none, nwm30_retrospective], default: none,
       description: "nwm30_retrospective also evaluates the NWM 3.0 retrospective at the same gages (1979-02 to 2023-01)"}
  outputs:
    - {name: evaluation, type: directory, data: teehr-metrics, path: evaluation}
  env:                                    # on the workdir, render's emptyDir: not the container's own layer
    HOME: "{workdir}"                     # entrypoint.sh's passwd file, Spark's and Java's home
    TMPDIR: "{workdir}"                   # the TEEHR evaluation's temporary folder
  network: true
  cpu: 2
  # measured on kind with a one-gage input: 3.1 GiB peak, 3.6 GiB with the NWM baseline (Spark's JVM and
  # Python's libraries, not the data); 4096 was OOMKilled (the pod's limit counts page cache too)
  ram_mb: 6144

- kind: pipeline
  id: ngiab-evaluation
  version: 0.1.0
  title: Preprocess, run NextGen, evaluate it against USGS observations (TEEHR)
  inputs:
