- kind: pipeline
  id: ngiab-calibration
  version: 0.2.0
  title: Preprocess, calibrate, run NextGen with the calibrated parameters, convert to cloud-native files
  inputs:
    # the only pipeline-level pattern, from the wiring: gage is also the preprocessor's feature, which
