[project]
name = "hydrowf-registry"
version = "0.1.0"
description = "hydrowf lego registry: versioned tool, data and pipeline legos over HTTP"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.1",
  "fastapi>=0.165.0",
  "hydrowf-core[auth]",
  "psycopg[binary]>=3.3.9",
  "pyyaml>=6.0.3",
  "sqlalchemy>=2.1.9",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "flake8>=7",
    "httpx>=0.28.1",
]

[tool.uv.sources]
hydrowf-core = { git = "https://github.com/Aquaveo/hydrowf-core", rev = "368115e" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
